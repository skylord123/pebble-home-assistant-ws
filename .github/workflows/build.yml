name: Build Pebble app

on:
  # Triggers the workflow on push or pull request events for all branches
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Build with Docker
        run: make docker-build

      - name: Rename app
        run: cp build/pebble.pbw pebble-home-assistant-on-your-wrist-g${{ env.COMMIT_SHORT_SHA }}.pbw

      - name: Generate ELF bundle
        run: |
          mkdir elfs
          for platform in basalt diorite chalk aplite emery; do
            if [ -f "build/$platform/pebble-app.elf" ]; then
              cp "build/$platform/pebble-app.elf" "elfs/pebble-app-$platform.elf"
            fi
          done
          zip -r elfs.zip elfs

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: pebble-home-assistant-on-your-wrist PBW
          path: pebble-home-assistant-on-your-wrist-g${{ env.COMMIT_SHORT_SHA }}.pbw
          if-no-files-found: error

      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: Debug ELFs
          path: elfs.zip
