# Workflow for deploying static content to GitHub Pages
# - docs/* and config/* come from master, which is what users have installed
# - config/* pages that master does not have yet come from dev, so test builds
#   of the next release can open theirs. A page master already has is never
#   taken from dev, since released apps open it by name.
name: Deploy static content to Pages

on:
  # Every run rebuilds the whole site from both branches, so only pushes to
  # them need to redeploy it
  push:
    branches: [master, dev]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-branch

      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-branch

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/config

          # The docs site lives at the root
          cp -r master-branch/docs/. deploy/
          echo "✓ Copied docs/ from master"

          # Released settings pages
          cp -r master-branch/config/. deploy/config/
          echo "✓ Copied config/ from master"

          # Pages only dev has yet. --update=none keeps master's copy of every
          # file that exists in both.
          cp -r --update=none dev-branch/config/. deploy/config/
          echo "✓ Added config/ files that only dev has"

          # A released page changed on dev would never reach anyone, and
          # changing it in place is what showed unreleased options to
          # released apps (#104). New options belong in a new page version.
          for f in master-branch/config/v*.html; do
            name=$(basename "$f")
            if [ -f "dev-branch/config/$name" ] && ! cmp -s "$f" "dev-branch/config/$name"; then
              echo "::warning file=config/$name::config/$name differs on dev, but released pages are only deployed from master. Put the changes in a new page version."
            fi
          done

          echo ""
          echo "=== Deployment directory contents ==="
          find deploy -type f | head -50 || echo "(empty)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

